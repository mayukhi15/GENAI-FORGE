<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Design Viewer</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #e5e5e5;
      margin: 0;
    }

    .cinema-title {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="min-h-screen">

  <header class="text-center py-8">
    <h1 class="cinema-title text-4xl font-bold text-white">Aural Landscape</h1>
    <div class="h-px w-1/2 mx-auto bg-gradient-to-r from-white/20 to-transparent mt-2"></div>
  </header>

  <main class="p-8 max-w-5xl mx-auto">
    <div id="sounddesign-container" class="space-y-6"></div>
    <div id="no-data" class="hidden text-center py-20 bg-white/5 rounded-3xl border border-dashed border-white/10">
      <p class="text-white/40">No sound data available. Generate a script first.</p>
    </div>
  </main>

  <script>
    // Example data (mimics SoundDesignNode array)
    const nodes = [
      {
        scene: "INT. LIVING ROOM - DAY",
        musicGenre: "Classical",
        effects: ["Door creak", "Footsteps", "Glass shatter"],
        ambientLayers: "Soft wind outside, faint street noise",
        notes: "Focus on tension between characters."
      },
      {
        scene: "EXT. PARK - NIGHT",
        musicGenre: "Ambient Electronic",
        effects: ["Leaves rustle", "Distant dog bark", "Water fountain"],
        ambientLayers: "Night breeze, city hum",
        notes: "Create an eerie, suspenseful mood."
      }
    ];

    const container = document.getElementById('sounddesign-container');
    const noData = document.getElementById('no-data');

    if (!nodes.length) {
      noData.classList.remove('hidden');
    } else {
      nodes.forEach(node => {
        const card = document.createElement('div');
        card.className = "bg-black/40 border border-white/5 rounded-2xl p-8 hover:bg-black/60 transition-colors border-l-4 border-l-red-600";

        card.innerHTML = `
          <div class="flex flex-col md:flex-row gap-8">
            <div class="md:w-1/3">
              <span class="text-[10px] text-red-500 font-bold uppercase tracking-[0.2em]">Scene Focus</span>
              <h3 class="text-xl font-bold text-white mt-1 mb-4">${node.scene}</h3>
              <div class="inline-flex items-center px-3 py-1 bg-white/5 rounded-full text-xs text-white/60 border border-white/10">
                <svg class="w-3 h-3 mr-2 text-red-500" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
                ${node.musicGenre}
              </div>
            </div>

            <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <h4 class="text-xs font-bold text-white/40 uppercase tracking-widest mb-3">Sound Effects (SFX)</h4>
                <ul class="space-y-2">
                  ${node.effects.map(effect => `
                    <li class="flex items-center text-sm text-white/70">
                      <span class="w-1 h-1 bg-red-500 rounded-full mr-3"></span>${effect}
                    </li>`).join('')}
                </ul>
              </div>

              <div>
                <h4 class="text-xs font-bold text-white/40 uppercase tracking-widest mb-3">Ambience</h4>
                <p class="text-sm text-white/70 bg-white/5 p-4 rounded-xl border border-white/5">
                  ${node.ambientLayers}
                </p>
              </div>
            </div>
          </div>

          <div class="mt-6 pt-6 border-t border-white/5">
            <p class="text-xs text-white/40 italic">
              <strong class="text-white/60 not-italic mr-2">Note:</strong> ${node.notes}
            </p>
          </div>
        `;

        container.appendChild(card);
      });
    }
  </script>

</body>
</html>
