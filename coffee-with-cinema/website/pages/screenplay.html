<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenplay Viewer</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #e5e5e5;
      margin: 0;
    }

    .screenplay-font {
      font-family: 'Courier Prime', monospace;
    }

    ::selection {
      background-color: #facc15; /* yellow-400 */
      color: black;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="text-center py-8">
    <h1 class="text-4xl font-bold text-white">Screenplay Viewer</h1>
  </header>

  <main class="flex-1 p-8">
    <div class="bg-white text-black min-h-[600px] shadow-2xl p-8 md:p-16 screenplay-font max-w-4xl mx-auto">
      <div id="screenplay-container" class="max-w-prose mx-auto"></div>
    </div>

    <div class="mt-8 text-center text-white/20 text-xs uppercase tracking-widest">
      End of Script • Draft 1.0
    </div>
  </main>

  <script>
    // Example screenplay text
    const scriptText = `
INT. LIVING ROOM - DAY

JANE
I can't believe this is happening.

(whispers)
We shouldn't be here.

JOHN
Relax. Everything is under control.

EXT. PARK - NIGHT

JANE
The moon looks beautiful tonight.

JOHN
Yes, but beware of shadows.
`;

    const container = document.getElementById('screenplay-container');

    scriptText.split('\n').forEach(line => {
      const trimmed = line.trim();
      const p = document.createElement('p');

      const isHeading = trimmed.startsWith('INT.') || trimmed.startsWith('EXT.');
      const isCharacter = trimmed === trimmed.toUpperCase() && trimmed.length > 0 && !isHeading;
      const isDialogue = !isHeading && !isCharacter && trimmed.length > 0;

      if (isHeading) {
        p.className = 'font-bold mb-6 mt-10 uppercase';
      } else if (isCharacter) {
        p.className = 'text-center w-full mb-1 mt-6 uppercase';
      } else if (isDialogue) {
        const isParenthetical = trimmed.startsWith('(');
        p.className = isParenthetical ? 'text-center w-1/2 mx-auto italic mb-4' : 'text-center w-3/4 mx-auto mb-4';
      } else {
        p.className = 'mb-4';
      }

      p.textContent = line;
      container.appendChild(p);
    });
  </script>

</body>
</html>
